services:
  redis:
    image: redis
    ports:
      - 6379:6379

  nginx:
    image: nginx
    ports:
      - 4000:80
    volumes:
      -  ./nginx.conf:/etc/nginx/nginx.conf

  server1:
    build: ./
    env_file:
      - ./.env
    environment:
      - SERVER_NAME="1st Server"
    ports:
      - 8001:5000
  server2:
    build: ./
    env_file:
      - ./.env
    environment:
      - SERVER_NAME="2nd Server"
    ports:
      - 8002:5000
  server3:
    build: ./
    env_file:
      - ./.env
    environment:
      - SERVER_NAME="3rd Server"
    ports:
      - 8003:5000